name: rhttp
description: Make HTTP requests using Rust for Flutter developers. It uses FFI to call Rust functions from Dart. On the Rust side, it uses reqwest to make HTTP requests.
version: 0.18.0
repository: https://codeberg.org/Tienisto/rhttp
topics:
  - http
  - rust
  - ffi
  - http2
  - http3
funding:
  - https://github.com/sponsors/Tienisto/

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.0.0
  http: ^1.5.0
  http_profile: ^0.1.0
  meta: ^1.12.0

dev_dependencies:
  build_runner: ^2.4.0
  ffi: ^2.1.0
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0'
  freezed: ^3.0.0
  mocktail: ^1.0.4
